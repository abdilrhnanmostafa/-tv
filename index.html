<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0a0f" />
<title>كاجوجي TV | مشاهدة أفلام ومسلسلات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   1. المتغيرات
   ============================================================ */
:root{
  --bg:#0a0a0f;
  --surface:#13131c;
  --surface-2:#1c1c28;
  --surface-3:#242433;
  --border:rgba(255,255,255,.08);
  --border-hover:rgba(255,255,255,.2);
  --text:#f2f2f7;
  --muted:#8b8ba3;
  --accent:#8b5cf6;
  --accent-2:#ec4899;
  --gold:#fbbf24;
  --green:#22c55e;
  --red:#ef4444;
  --radius:16px;
  --shadow:0 24px 60px -24px rgba(0,0,0,.95);
  --grad:linear-gradient(135deg,#8b5cf6,#ec4899);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:'Cairo',system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--text);
  min-height:100vh; overflow-x:hidden; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none;
  user-select:none;
}
body::before{
  content:''; position:fixed; inset:0; z-index:0;
  background:
    radial-gradient(760px circle at 10% -8%, rgba(139,92,246,.16), transparent 62%),
    radial-gradient(760px circle at 92% 2%, rgba(236,72,153,.11), transparent 62%);
  pointer-events:none;
}
body.locked{overflow:hidden}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#2e2e40;border-radius:20px}
::-webkit-scrollbar-thumb:hover{background:#3d3d55}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
img{max-width:100%;display:block;-webkit-user-drag:none;user-drag:none;pointer-events:none}
input,select,textarea{-webkit-user-select:text;user-select:text}
.hidden{display:none !important}
main{position:relative;z-index:1}

/* ============================================================
   2. شاشة تسجيل الدخول / إنشاء حساب
   ============================================================ */
#authScreen{
  position:fixed; inset:0; z-index:3000;
  display:flex; align-items:center; justify-content:center;
  padding:20px; overflow-y:auto;
  background:
    radial-gradient(900px circle at 20% -10%, rgba(139,92,246,.25), transparent 55%),
    radial-gradient(900px circle at 85% 15%, rgba(236,72,153,.2), transparent 55%),
    linear-gradient(180deg,#0a0a0f,#13131c);
}
#authScreen::before{
  content:''; position:absolute; inset:0;
  background-image:
    linear-gradient(rgba(139,92,246,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(139,92,246,.04) 1px, transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(circle at center, black 20%, transparent 80%);
  -webkit-mask-image:radial-gradient(circle at center, black 20%, transparent 80%);
  pointer-events:none;
}
.auth-card{
  position:relative; z-index:2;
  width:min(450px,100%);
  background:rgba(19,19,28,.72);
  backdrop-filter:blur(28px) saturate(160%);
  -webkit-backdrop-filter:blur(28px) saturate(160%);
  border:1px solid rgba(255,255,255,.1);
  border-radius:24px;
  padding:34px 30px 30px;
  box-shadow:0 40px 100px -30px rgba(0,0,0,.9);
  animation:authIn .6s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes authIn{from{opacity:0;transform:translateY(28px) scale(.96)}to{opacity:1;transform:none}}

.auth-brand{
  display:flex; align-items:center; justify-content:center; gap:10px;
  margin-bottom:6px;
}
.auth-brand .mark{
  width:52px; height:52px; border-radius:15px; background:var(--grad);
  display:grid; place-items:center; font-size:26px;
  box-shadow:0 14px 36px -10px rgba(139,92,246,.95);
}
.auth-brand h1{
  font-size:26px; font-weight:900; letter-spacing:-.6px;
  background:var(--grad); -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent;
}
.auth-sub{
  text-align:center; color:var(--muted); font-size:13.5px;
  margin-bottom:24px; font-weight:600;
}

.auth-tabs{
  display:grid; grid-template-columns:1fr 1fr; gap:6px;
  padding:5px; background:var(--surface-2);
  border-radius:14px; margin-bottom:22px;
  border:1px solid var(--border);
}
.auth-tab{
  padding:11px; border-radius:10px;
  font-size:14px; font-weight:700; color:var(--muted);
  transition:.28s cubic-bezier(.2,.8,.2,1);
}
.auth-tab.active{
  background:var(--grad); color:#fff;
  box-shadow:0 8px 22px -8px rgba(139,92,246,.95);
}

.auth-form{display:none; animation:fadeUp .4s both}
.auth-form.active{display:block}

.form-group{margin-bottom:14px}
.form-group label{
  display:block; font-size:13px; font-weight:700;
  color:#b9b9cd; margin-bottom:7px;
}
.form-input{
  position:relative;
}
.form-input svg{
  position:absolute; inset-inline-start:14px; top:50%; transform:translateY(-50%);
  width:18px; height:18px; stroke:var(--muted); pointer-events:none;
}
.form-input input{
  width:100%; padding:13px 44px;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:12px;
  font-size:14.5px; outline:none;
  transition:.25s;
}
.form-input input::placeholder{color:#5f5f78}
.form-input input:focus{
  border-color:rgba(139,92,246,.65);
  background:var(--surface-3);
  box-shadow:0 0 0 4px rgba(139,92,246,.14);
}
.form-input .toggle-pw{
  position:absolute; inset-inline-end:10px; top:50%; transform:translateY(-50%);
  width:32px; height:32px; border-radius:8px;
  display:grid; place-items:center;
  color:var(--muted); font-size:16px;
  transition:.2s;
}
.form-input .toggle-pw:hover{background:var(--surface-3); color:var(--text)}

.auth-btn{
  width:100%; padding:14px; margin-top:8px;
  border-radius:12px; background:var(--grad);
  color:#fff; font-weight:800; font-size:15px;
  box-shadow:0 14px 34px -12px rgba(139,92,246,.95);
  transition:.28s cubic-bezier(.2,.8,.2,1);
}
.auth-btn:hover:not(:disabled){transform:translateY(-2px); box-shadow:0 20px 42px -14px rgba(139,92,246,1)}
.auth-btn:disabled{opacity:.6; cursor:wait}

.auth-msg{
  padding:11px 15px; border-radius:11px;
  font-size:13px; font-weight:600;
  margin-bottom:14px; display:none;
}
.auth-msg.show{display:block; animation:fadeUp .3s both}
.auth-msg.error{background:rgba(239,68,68,.13); border:1px solid rgba(239,68,68,.35); color:#fca5a5}
.auth-msg.success{background:rgba(34,197,94,.13); border:1px solid rgba(34,197,94,.35); color:#86efac}

.auth-note{
  text-align:center; margin-top:18px;
  font-size:12px; color:var(--muted); line-height:1.7;
}
.auth-note a{color:#a78bfa; text-decoration:none; font-weight:700}
.auth-note a:hover{text-decoration:underline}

/* ============================================================
   3. الهيدر
   ============================================================ */
header{
  position:sticky; top:0; z-index:200;
  background:rgba(10,10,15,.82);
  backdrop-filter:blur(24px) saturate(170%);
  -webkit-backdrop-filter:blur(24px) saturate(170%);
  border-bottom:1px solid var(--border);
}
.header-inner{
  max-width:1500px; margin:0 auto; padding:13px 28px;
  display:flex; align-items:center; gap:20px;
}
.logo{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--text); flex-shrink:0}
.logo-mark{
  width:40px; height:40px; border-radius:12px; background:var(--grad);
  display:grid; place-items:center; font-size:20px;
  box-shadow:0 8px 24px -8px rgba(139,92,246,.9);
}
.logo-text{
  font-weight:900; font-size:20px; letter-spacing:-.5px;
  background:var(--grad); -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent;
}
nav{display:flex; gap:6px}
.nav-btn{
  padding:9px 16px; border-radius:11px; font-weight:600; font-size:14.5px;
  color:var(--muted); transition:.25s;
}
.nav-btn:hover{color:var(--text); background:var(--surface-2)}
.nav-btn.active{color:var(--text); background:var(--surface-3)}

.search-wrap{margin-inline-start:auto; position:relative; width:min(360px,38vw); flex-shrink:1}
.search-wrap svg{
  position:absolute; inset-inline-start:14px; top:50%; transform:translateY(-50%);
  width:17px; height:17px; stroke:var(--muted); pointer-events:none;
}
#searchInput{
  width:100%; padding:11px 42px; border-radius:12px;
  background:var(--surface-2); border:1px solid var(--border);
  font-size:14px; outline:none; transition:.25s;
}
#searchInput::placeholder{color:#5f5f78}
#searchInput:focus{
  border-color:rgba(139,92,246,.6); background:var(--surface-3);
  box-shadow:0 0 0 4px rgba(139,92,246,.12);
}
#clearSearch{
  position:absolute; inset-inline-end:9px; top:50%; transform:translateY(-50%);
  width:26px; height:26px; border-radius:8px; display:none; place-items:center;
  color:var(--muted); font-size:16px; transition:.2s;
}
#clearSearch:hover{background:var(--surface-3); color:var(--text)}
#clearSearch.show{display:grid}

/* حساب المستخدم */
.user-chip{
  display:flex; align-items:center; gap:9px;
  padding:5px 12px 5px 5px; border-radius:100px;
  background:var(--surface-2); border:1px solid var(--border);
  flex-shrink:0; cursor:pointer; transition:.25s;
}
.user-chip:hover{border-color:var(--border-hover); background:var(--surface-3)}
.user-avatar{
  width:32px; height:32px; border-radius:50%;
  background:var(--grad); color:#fff;
  display:grid; place-items:center;
  font-weight:800; font-size:13px;
}
.user-name{
  font-size:13px; font-weight:700;
  max-width:90px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.user-menu{
  position:absolute; top:calc(100% + 8px); inset-inline-end:0;
  min-width:200px; padding:6px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:14px; box-shadow:var(--shadow);
  z-index:250; display:none;
}
.user-menu.open{display:block; animation:fadeUp .25s both}
.user-menu-header{
  padding:12px 14px; border-bottom:1px solid var(--border);
  margin-bottom:6px;
}
.user-menu-header b{display:block; font-size:14px; margin-bottom:3px}
.user-menu-header small{color:var(--muted); font-size:12px;
  display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.user-menu button{
  width:100%; display:flex; align-items:center; gap:10px;
  padding:10px 14px; border-radius:10px;
  font-size:13.5px; font-weight:600; color:var(--text);
  transition:.2s;
}
.user-menu button:hover{background:var(--surface-2)}
.user-menu button.danger{color:#fca5a5}
.user-menu button.danger:hover{background:rgba(239,68,68,.12)}
.user-menu button svg{width:16px; height:16px}

/* ============================================================
   4. الهيرو
   ============================================================ */
#hero{
  position:relative; min-height:clamp(380px,68vh,640px);
  display:flex; align-items:flex-end; overflow:hidden; margin-bottom:8px;
}
.hero-bg{
  position:absolute; inset:0; background-size:cover; background-position:center 22%;
  transform:scale(1.06); animation:heroZoom 20s ease-out forwards;
}
@keyframes heroZoom{to{transform:scale(1)}}
.hero-bg::after{
  content:''; position:absolute; inset:0;
  background:
    linear-gradient(to top, var(--bg) 2%, rgba(10,10,15,.82) 34%, rgba(10,10,15,.25) 68%, rgba(10,10,15,.6) 100%),
    linear-gradient(to left, transparent 30%, rgba(10,10,15,.85) 100%);
}
.hero-inner{
  position:relative; max-width:1500px; width:100%; margin:0 auto; padding:0 28px 50px;
  display:flex; align-items:flex-end; gap:32px;
}
.hero-poster{
  width:200px; flex-shrink:0; border-radius:18px; overflow:hidden;
  box-shadow:var(--shadow); border:1px solid var(--border-hover); display:none;
}
.hero-poster img{width:100%; aspect-ratio:2/3; object-fit:cover}
@media(min-width:900px){.hero-poster{display:block}}
.hero-content{flex:1; min-width:0; animation:fadeUp .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.hero-tag{
  display:inline-flex; align-items:center; gap:8px;
  padding:6px 14px; border-radius:100px;
  background:rgba(139,92,246,.16); border:1px solid rgba(139,92,246,.35);
  color:#c4b5fd; font-size:12.5px; font-weight:700; margin-bottom:14px;
  backdrop-filter:blur(8px);
}
.hero-tag .dot{
  width:7px; height:7px; border-radius:50%; background:#a78bfa;
  box-shadow:0 0 10px #a78bfa; animation:pulse 1.8s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.hero-title{
  font-size:clamp(26px,4.5vw,56px); font-weight:900; line-height:1.12;
  letter-spacing:-1.2px; margin-bottom:14px;
  text-shadow:0 4px 30px rgba(0,0,0,.7);
}
.hero-meta{
  display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px;
  color:#b9b9cd; font-size:14px; font-weight:600; margin-bottom:16px;
}
.hero-meta .star{color:var(--gold)}
.hero-meta .sep{width:4px; height:4px; border-radius:50%; background:#4a4a63}
.hero-overview{
  max-width:620px; color:#c3c3d6; font-size:15px; line-height:1.85;
  margin-bottom:24px; display:-webkit-box; -webkit-line-clamp:3;
  -webkit-box-orient:vertical; overflow:hidden;
}

/* ============================================================
   5. الأزرار
   ============================================================ */
.btn{
  display:inline-flex; align-items:center; gap:9px;
  padding:12px 24px; border-radius:13px;
  font-weight:700; font-size:14.5px;
  transition:.28s cubic-bezier(.2,.8,.2,1); white-space:nowrap;
}
.btn svg{width:18px; height:18px}
.btn-primary{
  background:var(--grad); color:#fff;
  box-shadow:0 12px 32px -12px rgba(139,92,246,.95);
}
.btn-primary:hover{transform:translateY(-3px); box-shadow:0 20px 42px -14px rgba(139,92,246,1)}
.btn-ghost{
  background:rgba(255,255,255,.09); border:1px solid var(--border-hover);
  color:var(--text); backdrop-filter:blur(10px);
}
.btn-ghost:hover{background:rgba(255,255,255,.16); transform:translateY(-3px)}
.btn:disabled{opacity:.5; cursor:not-allowed; transform:none !important}

/* ============================================================
   6. التصنيفات
   ============================================================ */
.chips-bar{
  max-width:1500px; margin:0 auto; padding:6px 28px 24px;
  display:flex; gap:10px; overflow-x:auto; scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.chips-bar::-webkit-scrollbar{display:none}
.chip{
  padding:8px 18px; border-radius:100px;
  background:var(--surface-2); border:1px solid var(--border);
  color:var(--muted); font-size:13px; font-weight:600;
  white-space:nowrap; transition:.25s; flex-shrink:0;
}
.chip:hover{color:var(--text); border-color:var(--border-hover); background:var(--surface-3)}
.chip.active{
  background:var(--grad); color:#fff; border-color:transparent;
  box-shadow:0 8px 22px -10px rgba(139,92,246,.95);
}

/* ============================================================
   7. الصفوف والكروت
   ============================================================ */
.row-section{
  max-width:1500px; margin:0 auto; padding:0 28px 36px;
  animation:fadeUp .7s cubic-bezier(.2,.8,.2,1) both;
}
.row-head{
  display:flex; align-items:center; justify-content:space-between;
  gap:16px; margin-bottom:14px;
}
.row-title{
  font-size:clamp(16px,2.2vw,22px); font-weight:800; letter-spacing:-.5px;
  display:flex; align-items:center; gap:10px;
}
.row-title::before{content:''; width:4px; height:20px; border-radius:4px; background:var(--grad)}
.row-scroll{
  display:flex; gap:14px; overflow-x:auto; overflow-y:hidden;
  padding:6px 2px 16px; scroll-snap-type:x proximity; scrollbar-width:thin;
  -webkit-overflow-scrolling:touch;
}
.row-scroll::-webkit-scrollbar{height:6px}
.row-scroll::-webkit-scrollbar-thumb{background:#2b2b3d; border-radius:20px}

.card{
  position:relative; flex:0 0 auto; width:168px; aspect-ratio:2/3;
  border-radius:15px; overflow:hidden; background:var(--surface-2);
  cursor:pointer; scroll-snap-align:start;
  transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s;
  animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) both;
  animation-delay:var(--d,0ms);
}
.card:hover{
  transform:translateY(-8px) scale(1.03);
  box-shadow:0 22px 44px -18px rgba(0,0,0,.95), 0 0 0 1px rgba(139,92,246,.45);
  z-index:5;
}
.card img{width:100%; height:100%; object-fit:cover; transition:transform .6s}
.card:hover img{transform:scale(1.07)}
.card-shade{
  position:absolute; inset:0;
  background:linear-gradient(to top, rgba(8,8,13,.96) 4%, rgba(8,8,13,.45) 34%, transparent 62%);
}
.card-rating{
  position:absolute; top:8px; inset-inline-end:8px;
  padding:4px 8px; border-radius:8px;
  background:rgba(10,10,15,.82); backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.12);
  font-size:11px; font-weight:800; color:var(--gold);
  display:flex; align-items:center; gap:3px;
}
.card-type{
  position:absolute; top:8px; inset-inline-start:8px;
  padding:4px 8px; border-radius:8px;
  background:rgba(139,92,246,.85); backdrop-filter:blur(10px);
  font-size:10px; font-weight:800; color:#fff;
}
.card-info{position:absolute; inset-inline:0; bottom:0; padding:10px}
.card-info h3{
  font-size:13px; font-weight:700; line-height:1.4;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; margin-bottom:2px;
}
.card-info span{font-size:11px; color:var(--muted); font-weight:600}

/* ============================================================
   8. شبكة الاستعراض
   ============================================================ */
.browse-head{
  max-width:1500px; margin:0 auto; padding:14px 28px 20px;
  display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
}
.browse-head h2{font-size:clamp(20px,2.8vw,28px); font-weight:900; letter-spacing:-.8px}
.browse-head span{color:var(--muted); font-size:13.5px; font-weight:600}
.grid{
  max-width:1500px; margin:0 auto; padding:0 28px 40px;
  display:grid; grid-template-columns:repeat(auto-fill,minmax(155px,1fr));
  gap:16px;
}
.grid .card{width:100%}
.load-more-wrap{display:flex; justify-content:center; padding:8px 0 60px}
#loadMore{
  padding:13px 40px; border-radius:13px;
  background:var(--surface-2); border:1px solid var(--border);
  font-weight:700; font-size:14.5px; transition:.28s;
}
#loadMore:hover{border-color:rgba(139,92,246,.6); background:var(--surface-3); transform:translateY(-2px)}
#loadMore:disabled{opacity:.5; cursor:default; transform:none}

/* ============================================================
   9. هياكل التحميل
   ============================================================ */
.sk{
  background:linear-gradient(100deg,#1a1a26 20%,#252534 40%,#1a1a26 60%);
  background-size:220% 100%; animation:shimmer 1.5s infinite linear;
  border-radius:15px;
}
@keyframes shimmer{to{background-position:-220% 0}}
.sk-card{width:168px; aspect-ratio:2/3; flex:0 0 auto}
.sk-hero{height:clamp(380px,68vh,640px); border-radius:0; width:100%}

/* ============================================================
   10. النافذة المنبثقة
   ============================================================ */
.modal{
  position:fixed; inset:0; z-index:1000; display:none;
  align-items:flex-start; justify-content:center;
  padding:24px 16px; overflow-y:auto;
}
.modal.open{display:flex; animation:fadeIn .3s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-backdrop{
  position:fixed; inset:0; background:rgba(5,5,9,.85);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
}
.modal-panel{
  position:relative; width:min(1000px,100%);
  background:var(--surface); border:1px solid var(--border);
  border-radius:20px; overflow:hidden; box-shadow:var(--shadow);
  animation:modalIn .45s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes modalIn{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:none}}
.modal-close{
  position:absolute; top:14px; inset-inline-end:14px; z-index:20;
  width:38px; height:38px; border-radius:50%;
  background:rgba(10,10,15,.82); border:1px solid var(--border-hover);
  backdrop-filter:blur(10px); display:grid; place-items:center;
  font-size:18px; color:#fff; transition:.25s;
}
.modal-close:hover{background:var(--accent); transform:rotate(90deg)}

.modal-hero{position:relative; min-height:300px; display:flex; align-items:flex-end}
.modal-hero img.bd{
  position:absolute; inset:0; width:100%; height:100%;

}

}
.cast-list::-webkit-scrollbar{height:5px}

}

}
.cast-item small{
  font-size:10.5px; color:var(--muted);

}
.similar-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(115px,1fr)); gap:12px}

/* ============================================================
   11. المشغّل
   ============================================================ */
.player-section{margin-bottom:26px}
.player-toolbar{

}
.player-toolbar .label{font-size:12.5px; color:var(--muted); font-weight:700}
.server-btn{
  padding:7px 14px; border-radius:10px; background:var(--surface-2);
  border:1px solid var(--border); font-size:12.5px; font-weight:700;
  color:var(--muted); transition:.25s;
}
.server-btn:hover{color:var(--text); border-color:var(--border-hover); background:var(--surface-3)}
.server-btn.active{
  background:var(--grad); color:#fff; border-color:transparent;
  box-shadow:0 6px 18px -8px rgba(139,92,246,.9);
}
select.server-btn{
  appearance:none; padding-inline:14px 28px; cursor:pointer;
}
select.server-btn.active{background-color:rgba(139,92,246,.15); color:#c4b5fd}

.player-frame{
  position:relative; width:100%; aspect-ratio:16/9;
  background:#000; border-radius:14px; overflow:hidden;
  border:1px solid var(--border);
}
.player-frame iframe{
  width:100%; height:100%; border:0; display:block;
  position:relative; z-index:1;
}
.player-fallback{
  position:absolute; inset:0; display:grid; place-items:center;
  background:#08080d; text-align:center; padding:24px; z-index:2;
}
.player-fallback p{color:var(--muted); font-size:13.5px; margin-bottom:8px; max-width:440px}
.player-status{

  color:var(--muted); margin-top:10px; font-weight:600;
}
.player-status .dot{
  width:8px; height:8px; border-radius:50%;

}
.player-status .dot.warn{background:var(--gold); box-shadow:0 0 8px var(--gold)}

/* حماية المشغّل من التنزيل */
.player-frame::after{
  content:'كاجوجي TV'; position:absolute; bottom:14px; inset-inline-end:14px;

}

footer b{

#toast{

  if (e.target.closest('input, textarea')) return;
  e.preventDefault();
});
document.addEventListener('dragstart', e=>{
  if (e.target.tagName === 'IMG' || e.target.closest('.card, .player-frame')) {
    e.preventDefault();
  }
});
document.addEventListener('keydown', e=>{
  // F12
  if (e.key === 'F12'){ e.preventDefault(); return; }
  // Ctrl+Shift+I / J / C
  if (e.ctrlKey && e.shiftKey && ['I','J','C','i','j','c'].includes(e.key)){
    e.preventDefault(); return;
  }
  // Ctrl+U (view source)
  if (e.ctrlKey && (e.key === 'u' || e.key === 'U')){ e.preventDefault(); return; }
  // Ctrl+S (save page)
  if (e.ctrlKey && (e.key === 's' || e.key === 'S')){ e.preventDefault(); return; }
  // Ctrl+P (print)
  if (e.ctrlKey && (e.key === 'p' || e.key === 'P')){ e.preventDefault(); return; }
});

/* ============================================================
   نظام المصادقة (localStorage)
   ============================================================ */
const USERS_KEY = 'kajogi_users';
const SESSION_KEY = 'kajogi_session';

async function hashPassword(pw){
  try{
    const enc = new TextEncoder();
    const data = enc.encode(pw);
    const buf = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  } catch {
    // fallback بسيط
    let h = 0;
    for (let i = 0; i < pw.length; i++){ h = (h<<5) - h + pw.charCodeAt(i); h |= 0; }
    return String(h);
  }
}

function getUsers(){
  try { return JSON.parse(localStorage.getItem(USERS_KEY) || '[]'); }
  catch { return []; }
}
function saveUsers(users){
  localStorage.setItem(USERS_KEY, JSON.stringify(users));
}
function getSession(){
  try { return JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null'); }
  catch { return null; }
}
function saveSession(s){
  sessionStorage.setItem(SESSION_KEY, JSON.stringify(s));
}
function clearSession(){
  sessionStorage.removeItem(SESSION_KEY);
}

function showAuthMsg(elId, msg, type='error'){
  const el = $('#' + elId);
  el.textContent = msg;
  el.className = 'auth-msg show ' + type;
  setTimeout(()=>{ el.classList.remove('show'); }, 5000);
}

function setAuthLoading(btnId, loading, text){
  const btn = $('#' + btnId);
  if (!btn) return;
  btn.disabled = loading;
  if (loading){
    btn.dataset.orig = btn.textContent;
    btn.textContent = text || 'جارٍ...';
  } else {
    btn.textContent = btn.dataset.orig || text;
  }
}

/* تسجيل الدخول */
async function handleLogin(e){
  e.preventDefault();
  const email = $('#loginEmail').value.trim().toLowerCase();
  const password = $('#loginPassword').value;

  if (!email || !password){
    showAuthMsg('loginMsg','يرجى ملء جميع الحقول.'); return;
  }

  setAuthLoading('loginBtn', true, 'جارٍ التحقق...');

  const users = getUsers();
  const user = users.find(u => u.email === email);

  if (!user){
    setAuthLoading('loginBtn', false);
    showAuthMsg('loginMsg','لا يوجد حساب بهذا البريد الإلكتروني.');
    return;
  }

  const hash = await hashPassword(password);
  if (hash !== user.passwordHash){
    setAuthLoading('loginBtn', false);
    showAuthMsg('loginMsg','كلمة المرور غير صحيحة.');
    return;
  }

  saveSession({
    id: user.id, name: user.name, email: user.email, loginAt: Date.now()
  });

  setAuthLoading('loginBtn', false);
  showAuthMsg('loginMsg','تم تسجيل الدخول بنجاح!', 'success');

  setTimeout(()=>startApp(), 500);
}

/* إنشاء حساب */
async function handleRegister(e){
  e.preventDefault();
  const name = $('#regName').value.trim();
  const email = $('#regEmail').value.trim().toLowerCase();
  const pw1 = $('#regPassword').value;
  const pw2 = $('#regPassword2').value;

  if (name.length < 2){
    showAuthMsg('registerMsg','الاسم قصير جداً.'); return;
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    showAuthMsg('registerMsg','البريد الإلكتروني غير صالح.'); return;
  }
  if (pw1.length < 6){
    showAuthMsg('registerMsg','كلمة المرور يجب أن تكون 6 أحرف على الأقل.'); return;
  }
  if (pw1 !== pw2){
    showAuthMsg('registerMsg','كلمتا المرور غير متطابقتين.'); return;
  }

  setAuthLoading('registerBtn', true, 'جارٍ الإنشاء...');

  const users = getUsers();
  if (users.some(u => u.email === email)){
    setAuthLoading('registerBtn', false);
    showAuthMsg('registerMsg','هذا البريد مسجّل مسبقاً.');
    return;
  }

  const hash = await hashPassword(pw1);
  const newUser = {
    id: 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2,8),
    name, email,
    passwordHash: hash,
    createdAt: Date.now()
  };
  users.push(newUser);
  saveUsers(users);

  saveSession({
    id: newUser.id, name: newUser.name, email: newUser.email, loginAt: Date.now()
  });

  setAuthLoading('registerBtn', false);
  showAuthMsg('registerMsg','تم إنشاء الحساب بنجاح!', 'success');

  setTimeout(()=>startApp(), 500);
}

/* تشغيل التطبيق بعد الدخول */
function startApp(){
  $('#authScreen').style.display = 'none';
  $('#app').classList.remove('hidden');
  const session = getSession();
  if (session){
    $('#userName').textContent = session.name;
    $('#userAvatar').textContent = session.name.charAt(0).toUpperCase();
    $('#menuName').textContent = session.name;
    $('#menuEmail').textContent = session.email;
  }
  initApp();
}

}

function initAuth(){
  // التبويبات
  $$('.auth-tab').forEach(tab => {
    tab.addEventListener('click', ()=>{
      const target = tab.dataset.tab;
      $$('.auth-tab').forEach(t=>t.classList.toggle('active', t === tab));
      $$('.auth-form').forEach(f=>f.classList.toggle('active', f.id === target+'Form'));

  $$('[data-switch]').forEach(link => {

      const target = link.dataset.switch;
      $$('.auth-tab').forEach(t=>t.classList.toggle('active', t.dataset.tab === target));
      $$('.auth-form').forEach(f=>f.classList.toggle('active', f.id === target+'Form'));
    });
  });

  // إظهار/إخفاء كلمة المرور
  $$('.toggle-pw').forEach(btn => {
    btn.addEventListener('click', ()=>{

      const isPw = input.type === 'password';
      input.type = isPw ? 'text' : 'password';
      btn.textContent = isPw ? '🙈' : '👁';
    });
  });

  // النماذج
  $('#loginForm').addEventListener('submit', handleLogin);
  $('#registerForm').addEventListener('submit', handleRegister);
}

/* ============================================================
   API
   ============================================================ */
async function api(path, params={}){
  const url = new URL(BASE+path);
  url.searchParams.set('language','ar');
  for (const [k,v] of Object.entries(params)){
    if (v!==undefined && v!==null && v!=='') url.searchParams.set(k,v);
  }
  const res = await fetch(url, {
    headers:{
      Authorization:`Bearer ${TOKEN}`,
      'Content-Type':'application/json;charset=utf-8'
    }
  });
  if (!res.ok) throw new Error(`فشل الطلب (${res.status})`);
  return res.json();
}

function typeOf(item){
  if (item.media_type==='tv' || item.media_type==='movie') return item.media_type;
  return item.first_air_date ? 'tv' : 'movie';
}

function cardHTML(item, index=0){
  const type  = typeOf(item);
  const title = item.title || item.name || 'بدون عنوان';
  const date  = (item.release_date || item.first_air_date || '').slice(0,4) || '—';
  const rate  = item.vote_average ? item.vote_average.toFixed(1) : '—';
  return `
    <article class="card" data-id="${item.id}" data-type="${type}" style="--d:${Math.min(index*30,400)}ms">
      <img loading="lazy" src="${img(item.poster_path)}" alt="${esc(title)}"
           onerror="this.onerror=null;this.src='${PLACEHOLDER}'">
      <div class="card-shade"></div>
      <span class="card-type">${type==='tv'?'مسلسل':'فيلم'}</span>
      <span class="card-rating">★ ${rate}</span>
      <div class="card-info">
        <h3>${esc(title)}</h3>
        <span>${date}</span>
      </div>
    </article>`;
}

function skeletonRow(count=7){

}

    el.innerHTML = `<span class="dot"></span> الموسم ${media.season} · الحلقة ${media.episode}`;
  } else {
    el.innerHTML = `<span class="dot"></span> فيلم كامل`;
  }
}

/* ============================================================
   تفاصيل النافذة
   ============================================================ */
function renderDetails(d, type){
  const title = d.title || d.name || 'بدون عنوان';
  const date  = (d.release_date || d.first_air_date || '').slice(0,4);
  const rate  = d.vote_average ? d.vote_average.toFixed(1) : '—';
  const votes = d.vote_count ? `${d.vote_count.toLocaleString('ar-EG')} تقييم` : '';
  const genres = (d.genres||[]).map(g=>`<span>${esc(g.name)}</span>`).join('');

  let lengthInfo = '';
  if (type==='movie' && d.runtime){
    const h = Math.floor(d.runtime/60), m = d.runtime%60;
    lengthInfo = `${h>0?h+' س ':''}${m} د`;
  } else if (type==='tv' && d.number_of_seasons){
    lengthInfo = `${d.number_of_seasons} ${d.number_of_seasons===1?'موسم':'مواسم'}`;
  }

  const videos = d.videos?.results || [];
  const trailer = videos.find(v=>v.site==='YouTube' && v.type==='Trailer')
               || videos.find(v=>v.site==='YouTube' && v.type==='Teaser')
               || videos.find(v=>v.site==='YouTube');

  const cast = (d.credits?.cast||[]).slice(0,14);
  const similar = (d.similar?.results||[]).filter(x=>x.poster_path).slice(0,12);
  const imdbId = d.imdb_id || d.external_ids?.imdb_id || '';

  currentMedia = {
    id:d.id, type, title,
    season:1, episode:1,
    totalSeasons: d.number_of_seasons || 0
  };

  let seasonSelector = '';
  if (type==='tv' && d.number_of_seasons > 0){
    const seasonOpts = Array.from({length:d.number_of_seasons},
      (_,i)=>`<option value="${i+1}">الموسم ${i+1}</option>`).join('');
    seasonSelector = `
      <select id="seasonSelect" class="server-btn">${seasonOpts}</select>
      <select id="episodeSelect" class="server-btn"></select>`;
  }

  modalPanel.innerHTML = `
    <button class="modal-close" data-close>✕</button>

    <div class="modal-hero">
      <img class="bd" src="${img(d.backdrop_path,'w1280')}" alt=""
           onerror="this.onerror=null;this.src='${PLACEHOLDER}'">
      <div class="modal-hero-content">
        <div class="modal-poster">
          <img src="${img(d.poster_path,'w500')}" alt="${esc(title)}"
               onerror="this.onerror=null;this.src='${PLACEHOLDER}'">
        </div>
        <div class="modal-titles">
          <h2>${esc(title)}</h2>
          <div class="modal-meta">
            <span class="star">★ ${rate}</span>
            ${votes?`<span>${votes}</span>`:''}
            ${date?`<span>${date}</span>`:''}
            ${lengthInfo?`<span class="pill">${lengthInfo}</span>`:''}
            <span class="pill">${type==='tv'?'مسلسل':'فيلم'}</span>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            ${trailer?`
              <button class="btn btn-ghost" data-trailer="${trailer.key}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                  <rect x="2" y="4" width="20" height="16" rx="3"/><path d="m10 9 5 3-5 3z" fill="currentColor" stroke="none"/>
                </svg>
                الإعلان
              </button>`:''}
            ${imdbId?`
              <a class="btn btn-ghost" target="_blank" rel="noopener"
                 href="https://www.imdb.com/title/${imdbId}/" style="text-decoration:none">
                IMDb ↗
              </a>`:''}
          </div>
        </div>
      </div>
    </div>

    <div class="modal-body">

      <div class="player-section">
        <h3 class="sec-title">مشاهدة الآن</h3>

        <div class="player-toolbar">
          <span class="label">المصدر:</span>
          ${STREAM_PROVIDERS.map(p=>
            `<button class="server-btn" data-server="${p.id}">${p.label}</button>`).join('')}
          <button class="server-btn" id="openExternalBtn"
            style="background:rgba(139,92,246,.2);color:#c4b5fd;border-color:rgba(139,92,246,.4)">
            ↗ فتح خارجي
          </button>
          ${seasonSelector}
        </div>

        <div class="player-frame" id="playerFrame">
          <div class="player-fallback" id="playerFallback">
            <div>
              <div style="font-size:32px;margin-bottom:10px">🎬</div>
              <p>جارٍ التحميل...</p>
            </div>
          </div>
        </div>

        <div class="player-status" id="playerStatus">
          <span class="dot warn"></span> في انتظار اختيار المصدر
        </div>
      </div>

      ${genres?`<div class="genre-list">${genres}</div>`:''}

      ${d.overview
        ? `<p class="modal-overview">${esc(d.overview)}</p>`
        : `<p class="modal-overview" style="color:var(--muted)">لا يوجد وصف متاح بالعربية.</p>`}

      ${cast.length?`
        <h3 class="sec-title">طاقم العمل</h3>
        <div class="cast-list">
          ${cast.map(c=>`
            <div class="cast-item">
              <img loading="lazy" src="${c.profile_path?img(c.profile_path,'w185'):PLACEHOLDER}"
                   alt="${esc(c.name)}" onerror="this.onerror=null;this.src='${PLACEHOLDER}'">
              <b>${esc(c.name)}</b>
              <small>${esc(c.character||'')}</small>
            </div>`).join('')}
        </div>`:''}

      ${similar.length?`
        <h3 class="sec-title" style="margin-top:14px">أعمال مشابهة</h3>
        <div class="similar-grid">
          ${similar.map((s,i)=>cardHTML({...s, media_type:type}, i)).join('')}
        </div>`:''}
    </div>`;

  if (type==='tv'){
    fillEpisodes(1, d.number_of_episodes || 24);
  }

  setTimeout(()=>playStream(STREAM_PROVIDERS[0].id, currentMedia), 250);
}

function fillEpisodes(season, count){
  const sel = $('#episodeSelect');
  if (!sel) return;
  const n = Math.max(count, 1);
  sel.innerHTML = Array.from({length:n},(_,i)=>`<option value="${i+1}">الحلقة ${i+1}</option>`).join('');
}

/* ============================================================
   التنقل
   ============================================================ */
function goHome(){
  $('#searchInput').value = '';
  $('#clearSearch').classList.remove('show');
  state.query = '';
  state.activeGenre = null;
  $$('.chip').forEach(c=>c.classList.toggle('active', c.dataset.genre===''));
  $$('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.nav==='home'));
  $$('.bottom-nav button').forEach(b=>b.classList.toggle('active', b.dataset.nav==='home'));
  showView('home');
  window.scrollTo({top:0, behavior:'smooth'});
}

function navigateTo(nav){
  $$('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.nav===nav));
  $$('.bottom-nav button').forEach(b=>b.classList.toggle('active', b.dataset.nav===nav));
  $('#searchInput').value = '';
  $('#clearSearch').classList.remove('show');

  if (nav==='home'){ goHome(); return; }
  if (nav==='movies') openBrowse({ title:'أفلام شائعة', loader: loaders.movies });
  if (nav==='tv') openBrowse({ title:'مسلسلات شائعة', loader: loaders.tv });
  if (nav==='search'){ $('#searchInput').focus(); window.scrollTo({top:0}); }
}

/* ============================================================
   الأحداث
   ============================================================ */
function bindEvents(){

  $('#logoBtn').addEventListener('click', e=>{ e.preventDefault(); goHome(); });

  // قائمة المستخدم
  const chip = $('#userChip');
  const menu = $('#userMenu');
  chip.addEventListener('click', e=>{
    e.stopPropagation();
    menu.classList.toggle('open');
  });
  document.addEventListener('click', e=>{
    if (!e.target.closest('#userChip') && !e.target.closest('#userMenu')){
      menu.classList.remove('open');
    }
  });
  $('#logoutBtn').addEventListener('click', logout);

  // التنقل (رئيسي + شريط سفلي)
  $$('.nav-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>navigateTo(btn.dataset.nav));
  });
  $$('.bottom-nav button').forEach(btn=>{
    btn.addEventListener('click', ()=>navigateTo(btn.dataset.nav));
  });

  // البحث
  const input = $('#searchInput');
  const clearBtn = $('#clearSearch');
  input.addEventListener('input', e=>{
    const v = e.target.value;
    clearBtn.classList.toggle('show', v.length>0);
    doSearch(v);
  });
  input.addEventListener('keydown', e=>{
    if (e.key==='Escape'){ input.value=''; clearBtn.classList.remove('show'); goHome(); }
  });
  clearBtn.addEventListener('click', ()=>{
    input.value=''; clearBtn.classList.remove('show'); goHome(); input.focus();
  });

  // التصنيفات
  $('#chips').addEventListener('click', e=>{
    const chip = e.target.closest('.chip');
    if (!chip) return;
    $$('.chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    const gid = chip.dataset.genre;
    state.activeGenre = gid || null;
    $$('.nav-btn').forEach(b=>b.classList.remove('active'));
    $$('.bottom-nav button').forEach(b=>b.classList.remove('active'));
    if (!gid){ goHome(); return; }
    const name = state.genres.find(g=>String(g.id)===gid)?.name || '';
    openBrowse({ title:`أفلام ${name}`, loader: loaders.genre(gid) });
  });

  // تفويض الأحداث
  document.addEventListener('click', e=>{
    const openBtn = e.target.closest('[data-open]');
    if (openBtn){ openDetails(openBtn.dataset.open, openBtn.dataset.type); return; }

    const trailerBtn = e.target.closest('[data-trailer]');
    if (trailerBtn){
      const key = trailerBtn.dataset.trailer;
      const frame = $('#playerFrame');
      if (frame){
        frame.innerHTML = `
          <iframe src="https://www.youtube.com/embed/${key}?autoplay=1&rel=0&modestbranding=1"
                  sandbox="allow-scripts allow-same-origin allow-presentation"
                  allow="autoplay; encrypted-media; fullscreen" allowfullscreen
                  referrerpolicy="no-referrer" title="الإعلان"></iframe>`;
        const status = $('#playerStatus');
        if (status) status.innerHTML = `<span class="dot warn"></span> يتم عرض الإعلان الرسمي`;
      }
      return;
    }

    const serverBtn = e.target.closest('.server-btn[data-server]');
    if (serverBtn && currentMedia){
      playStream(serverBtn.dataset.server, currentMedia);
      return;
    }

    if (e.target.closest('#openExternalBtn') && currentMedia){
      const active = $$('.server-btn[data-server]').find(b=>b.classList.contains('active'));
      const providerId = active?.dataset.server || STREAM_PROVIDERS[0].id;
      const provider = STREAM_PROVIDERS.find(p=>p.id===providerId);
      const url = buildStreamUrl(provider, currentMedia);
      window.open(url, '_blank', 'noopener,noreferrer');
      return;
    }

    const cardInModal = e.target.closest('.modal-panel .card');
    if (cardInModal){ openDetails(cardInModal.dataset.id, cardInModal.dataset.type); return; }

    const card = e.target.closest('.card');
    if (card){ openDetails(card.dataset.id, card.dataset.type); return; }

    if (e.target.closest('[data-close]')) closeModal();
  });

  // تغيير الموسم/الحلقة
  document.addEventListener('change', e=>{
    if (e.target.id === 'seasonSelect'){
      const season = parseInt(e.target.value,10) || 1;
      if (!currentMedia) return;
      currentMedia.season = season;
      currentMedia.episode = 1;
      fillEpisodes(season, 24);
      const active = $$('.server-btn[data-server]').find(b=>b.classList.contains('active'));
      playStream(active?.dataset.server || STREAM_PROVIDERS[0].id, currentMedia);
    }
    if (e.target.id === 'episodeSelect'){
      const episode = parseInt(e.target.value,10) || 1;
      if (!currentMedia) return;
      currentMedia.episode = episode;
      const active = $$('.server-btn[data-server]').find(b=>b.classList.contains('active'));
      playStream(active?.dataset.server || STREAM_PROVIDERS[0].id, currentMedia);
    }
  });

  document.addEventListener('keydown', e=>{
    if (e.key==='Escape' && modal.classList.contains('open')) closeModal();
  });

  $('#loadMore').addEventListener('click', loadNextPage);
}

/* ============================================================
   إغلاق النافذة
   ============================================================ */
function closeModal(){
  modal.classList.remove('open');
  document.body.classList.remove('locked');
  modalPanel.innerHTML = '';
  currentMedia = null;
}

/* ============================================================
   تهيئة التطبيق
   ============================================================ */
async function initApp(){
  if (state.appStarted) return;
  state.appStarted = true;

  bindEvents();
  $('#hero').innerHTML = `<div class="sk sk-hero"></div>`;
  renderRowsSkeleton();
  await loadGenres();
  loadHero();
  loadRows();
}

/* ============================================================
   نقطة البداية
   ============================================================ */
function boot(){
  initAuth();
  const session = getSession();
  if (session){
    startApp();
  }
  // خلاف ذلك، تبقى شاشة الدخول ظاهرة
}

boot();
</script>
